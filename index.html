<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>

    <!-- Google Fonts: Merriweather -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header">
    <div class="buttons">
        <button class="new-book">New Book</button>
        <dialog id="book-dialog">
            <form id="book-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" placeholder="Harry Potter" required>
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" name="author" id="author" placeholder="J.K Rowling" required>
                </div>

                <div class="form-group">
                    <label for="pages">Pages Read</label>
                    <input type="number" name="pages" id="pages" placeholder="120" required>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="submit">Submit</button>
                    <button type="button" id="cancel">Cancel</button>
                </div>
            </form>
        </dialog>
    </div>

    <h1 class="title">LIBRARY</h1>
</div>

<div id="container"></div>


<script src="script/index.js"></script>
</body>
</html>
